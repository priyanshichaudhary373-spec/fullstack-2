<!DOCTYPE html>

        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card {
            width: 180px;
            background-color: white;
            border: 1px solid black;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 120px;
        }

        .card h3 {
            color: blue;
        }

        .card p {
            padding: 5px;
        }
    </style>
</head>

<body>
