<!DOCTYPE html>
<html>
<head>
    <title>Concentric Circles</title>

    <style>
        .circle {
            border-radius: 50%;
            position: absolute;
        }

        .outer {
            width: 60px;
            height: 60px;
            background-color: red;
            top: 50px;
            left: 50px;
        }

        .middle {
            width: 40px;
            height: 40px;
            background-color: yellow;
            top: 60px;
            left: 60px;
        }

        .inner {
            width: 20px;
            height: 20px;
            background-color: blue;
            top: 70px;
            left: 70px;
        }
    </style>
</head>

<body>

    <div class="circle outer"></div>
    <div class="circle middle"></div>
    <div class="circle inner"></div>

</body>
</html>
