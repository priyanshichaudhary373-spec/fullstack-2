<!DOCTYPE html>
<html>
<head>
    <title>Random Joke Generator</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: darkblue;
        }

        #joke {
            font-size: 20px;
            margin: 25px;
        }

        button {
            background-color: green;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>😂 Random Joke Generator</h1>

        <p id="joke">Click the button to get a joke!</p>

        <button onclick="getJoke()">Get Joke</button>

    </div>

    <script>

        async function getJoke() {

    let jokeElement = document.getElementById("joke");

    jokeElement.textContent = "Loading joke...";

    try {

        let response = await fetch(
            "https://v2.jokeapi.dev/joke/Any?type=single&safe-mode"
        );

        if (!response.ok) {
            throw new Error("API Error");
        }

        let data = await response.json();

        jokeElement.textContent = data.joke;

    }

    catch (error) {

        jokeElement.textContent =
            "Unable to load joke. Please try again.";

        console.log(error);

    }
}

    </script>

</body>
</html>
